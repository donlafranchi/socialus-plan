name: cloudflare dashboard

# Publishes the generated dashboard to Cloudflare Pages (https://socialus-plan-dashboard.pages.dev), behind Cloudflare Access
# (PM's email only; set up once by `cloudflare setup`). Until an Access app for the site exists it publishes only an empty 'Private' page. Same triggers as pages.yml. Does nothing until the
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets exist. After deploying it checks that the site is NOT served
# to an anonymous visitor and fails if it is: the dashboard holds private plans.
on:
  workflow_run:
    workflows: [dashboard]
    types: [completed]
  push:
    branches: [main]
    paths: ['dashboard/status-dashboard.html']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-dashboard
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HAVE_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v5
        if: env.HAVE_SECRETS == 'true'
        with:
          ref: main
      - name: Is Cloudflare Access confirmed in front of the site?
        id: access
        if: env.HAVE_SECRETS == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          n=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps" \
            | jq -r '[.result[]? | select(.domain=="socialus-plan-dashboard.pages.dev")] | length' 2>/dev/null || echo 0)
          if [ "${n:-0}" -ge 1 ]; then echo "locked=true" >> "$GITHUB_OUTPUT"; echo "Access app found."
          else echo "locked=false" >> "$GITHUB_OUTPUT"; echo "::warning::Access not confirmed; publishing the empty 'Private' placeholder only."; fi
      - name: Stage the site (real dashboard only when Access is confirmed)
        if: env.HAVE_SECRETS == 'true'
        run: |
          mkdir -p _site
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          if [ "${{ steps.access.outputs.locked }}" = true ]; then cp dashboard/status-dashboard.html _site/index.html
          else printf '<!doctype html><meta charset=utf-8><meta name=robots content=noindex><title>Private</title><body style="font:16px system-ui;display:grid;place-items:center;height:100vh;margin:0"><p>Private</p>\n' > _site/index.html; fi
      - name: Create the Pages project (skipped if it exists)
        if: env.HAVE_SECRETS == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@4 pages project list 2>/dev/null | grep -q 'socialus-plan-dashboard'; then echo "project exists"
          else npx --yes wrangler@4 pages project create socialus-plan-dashboard --production-branch=main || echo "create failed or raced; deploy will say"; fi
      - name: Deploy to Cloudflare Pages
        if: env.HAVE_SECRETS == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=socialus-plan-dashboard --branch=main --commit-dirty=true
      - name: Refuse if the real dashboard is open to anonymous visitors
        if: env.HAVE_SECRETS == 'true' && steps.access.outputs.locked == 'true'
        run: |
          sleep 10
          code=$(curl -s -o /dev/null -w '%{http_code}' https://socialus-plan-dashboard.pages.dev/)
          echo "Anonymous request returned $code"
          if [ "$code" = 200 ]; then echo "::error::Dashboard is public. Run 'cloudflare setup' (Cloudflare Access)."; exit 1; fi
      - name: No secrets yet
        if: env.HAVE_SECRETS != 'true'
        run: echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping."
