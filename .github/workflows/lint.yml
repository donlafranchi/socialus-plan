name: lint

# Runs scripts/lint.sh, including the marker checker and its known-bad fixtures
# ([guard-proves-itself]). The process absolutes the slug check reads live in
# socialus-ops (formerly ops-pattern), the method repo, so it is checked out
# beside this one. It is private: the checkout reads it with SOCIALUS_READ_TOKEN.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          path: socialus-plan
          fetch-depth: 0  # the replaces checker reads git history
      - uses: actions/checkout@v5
        with:
          repository: donlafranchi/socialus-ops
          path: ops-pattern  # scripts/lint.sh looks for ../ops-pattern
          token: ${{ secrets.SOCIALUS_READ_TOKEN }}
      - run: bash scripts/lint.sh
        working-directory: socialus-plan
